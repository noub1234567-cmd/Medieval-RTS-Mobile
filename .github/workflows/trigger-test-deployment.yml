name: Trigger Test Game Deployment

on:
  push:
    branches: [building-upgrades]

jobs:
  trigger-test-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment to test repository
        env:
          TOKEN: ${{ secrets.TEST_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TEST_REPO_DISPATCH_TOKEN secret is not configured."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/noub1234567-cmd/Medieval-RTS-Test/dispatches \
            -d '{"event_type":"game-source-updated"}'
